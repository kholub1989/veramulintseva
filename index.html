<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Vera Mulintseva</title>
  <meta
    name="description"
    content="Vera Mulintseva's personal website is currently under construction."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    .coming-soon {
      max-width: 420px;
      text-align: center;
    }

    .coming-soon__name {
      margin: 0 0 12px;
      font-size: clamp(2rem, 8vw, 3.5rem);
      font-weight: 600;
      line-height: 1.1;
    }

    .coming-soon__message {
      margin: 0;
      font-size: 1rem;
      color: #666;
    }
  </style>
</head>

<body>
  <main class="coming-soon">
    <h1 class="coming-soon__name">Vera Mulintseva</h1>
    <p class="coming-soon__message">
      Website under construction.
    </p>
  </main>
</body>
</html>
